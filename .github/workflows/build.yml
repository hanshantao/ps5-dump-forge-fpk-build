name: build

# 同一 Release 同时发布 x86_64 与 arm64 二进制。两者都在 rust:1-bookworm
# 容器中原生编译，保证目标设备需要的 glibc 不高于 Debian 12 / fnOS 的 2.36。
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "上游 tag（如 v0.5.5）；留空取最新 release"
        required: false
        default: ""
      force:
        description: "该上游版本已构建过也重编（构建号 +1）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  UPSTREAM: quer3q/ps5-dump-forge
  MIRROR: https://ghfast.top
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      skip: ${{ steps.dup.outputs.skip }}
      ver: ${{ steps.dup.outputs.ver }}
    steps:
      - name: 解析上游 tag
        id: t
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$UPSTREAM/releases/latest" | jq -r .tag_name)
          fi
          if [ -z "$TAG" ] || [ "$TAG" = "null" ]; then echo "::error::拿不到上游 tag"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "up=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 去重并分配构建号
        id: dup
        run: |
          set -euo pipefail
          UP="${{ steps.t.outputs.up }}"
          OLD=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" | jq -r --arg p "v${UP}-" '[.[] | select(.tag_name | startswith($p))] | sort_by(.created_at) | last | .tag_name // ""')
          if [ -n "$OLD" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"; echo "已有 $OLD，跳过构建"
          else
            N=1; if [ -n "$OLD" ]; then N=$(( ${OLD##*-} + 1 )); fi
            BASE="${{ vars.BUILD_BASE }}"; BASE="${BASE:-0}"
            if [ "$N" -le "$BASE" ]; then N=$(( BASE + 1 )); fi
            echo "skip=false" >> "$GITHUB_OUTPUT"; echo "ver=${UP}-${N}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            docker_platform: linux/amd64
          - arch: arm64
            runner: ubuntu-22.04-arm
            docker_platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 构建 ${{ matrix.arch }}（容器内）
        run: |
          set -euo pipefail
          mkdir -p out work
          docker run --rm --platform=${{ matrix.docker_platform }} \
            -v "$PWD/ci:/scripts:ro" -v "$PWD/out:/out" -v "$PWD/work:/work" \
            -e FORGE_TAG="${{ needs.resolve.outputs.tag }}" -e FORGE_ARCH="${{ matrix.arch }}" \
            -e FORGE_REPO_URL="https://github.com/$UPSTREAM" -e FORGE_NODE_BASE="https://nodejs.org/dist" \
            -e FORGE_NPM_REGISTRY="https://registry.npmjs.org" -e FORGE_CARGO_DIRECT=1 -e NODE_VER=v22.14.0 \
            rust:1-bookworm sh /scripts/build-in-docker.sh
      - name: 产物闸门（Web UI / glibc / 架构 / 可执行性）
        run: |
          set -euo pipefail
          sudo chmod -R a+rX out
          bash ci/check-artifact.sh out/ps5-dump-forge-webui "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ps5-dump-forge-${{ matrix.arch }}
          path: out/ps5-dump-forge-webui
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [resolve, build]
    if: always() && needs.resolve.outputs.skip != 'true' && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          pattern: ps5-dump-forge-*
          path: artifacts
          merge-multiple: false
      - name: 封装可安装的飞牛 FPK
        run: |
          set -euo pipefail
          curl -fsSL -o fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64
          chmod 755 fnpack
          mkdir -p packages
          FNPACK_BIN="$PWD/fnpack" bash ci/build-fpk.sh \
            artifacts/ps5-dump-forge-x86_64/ps5-dump-forge-webui x86_64 \
            "${{ needs.resolve.outputs.ver }}" packages
          FNPACK_BIN="$PWD/fnpack" bash ci/build-fpk.sh \
            artifacts/ps5-dump-forge-arm64/ps5-dump-forge-webui arm64 \
            "${{ needs.resolve.outputs.ver }}" packages
          bash ci/check-fpk.sh packages/ps5-dump-forge-fnos-x86_64.${{ needs.resolve.outputs.ver }}.fpk x86_64
          bash ci/check-fpk.sh packages/ps5-dump-forge-fnos-arm64.${{ needs.resolve.outputs.ver }}.fpk arm64
      - name: 发双架构 Release
        id: rel
        run: |
          set -euo pipefail
          VER="${{ needs.resolve.outputs.ver }}"
          X64="ps5-dump-forge-x86_64.${VER}"; ARM="ps5-dump-forge-arm64.${VER}"
          X64_FPK="packages/ps5-dump-forge-fnos-x86_64.${VER}.fpk"
          ARM_FPK="packages/ps5-dump-forge-fnos-arm64.${VER}.fpk"
          cp artifacts/ps5-dump-forge-x86_64/ps5-dump-forge-webui "$X64"
          cp artifacts/ps5-dump-forge-arm64/ps5-dump-forge-webui "$ARM"
          chmod 755 "$X64" "$ARM"
          X64_SHA=$(sha256sum "$X64" | cut -d' ' -f1); X64_SIZE=$(stat -c%s "$X64")
          ARM_SHA=$(sha256sum "$ARM" | cut -d' ' -f1); ARM_SIZE=$(stat -c%s "$ARM")
          {
            echo "x64_sha=$X64_SHA"; echo "x64_size=$X64_SIZE"
            echo "arm_sha=$ARM_SHA"; echo "arm_size=$ARM_SIZE"
            echo "x64_url=$MIRROR/https://github.com/${{ github.repository }}/releases/download/v${VER}/${X64}"
            echo "arm_url=$MIRROR/https://github.com/${{ github.repository }}/releases/download/v${VER}/${ARM}"
          } >> "$GITHUB_OUTPUT"
          cat > notes.md <<EOF
          自动构建自上游 **${{ needs.resolve.outputs.tag }}**，含飞牛统一网关前缀补丁。

          - 可安装包：ps5-dump-forge-fnos-x86_64.*.fpk 与 ps5-dump-forge-fnos-arm64.*.fpk
          - 原始二进制：Linux x86_64 与 ARM64，要求 glibc ≤ 2.36（Debian 12 / 飞牛 fnOS）
          - 校验：Web UI 已嵌入、二进制架构正确、\`--help\` 可执行
          - 源码：https://github.com/$UPSTREAM/tree/${{ needs.resolve.outputs.tag }}
          EOF
          gh release create "v${VER}" "$X64" "$ARM" "$X64_FPK" "$ARM_FPK" --title "飞牛壳 ${VER}（上游 ${{ needs.resolve.outputs.tag }}）" --notes-file notes.md
      - name: 刷新 feed/manifest.json
        run: |
          set -euo pipefail
          python3 - "${{ needs.resolve.outputs.ver }}" "${{ steps.rel.outputs.x64_url }}" "${{ steps.rel.outputs.x64_sha }}" "${{ steps.rel.outputs.x64_size }}" "${{ steps.rel.outputs.arm_url }}" "${{ steps.rel.outputs.arm_sha }}" "${{ steps.rel.outputs.arm_size }}" "${{ needs.resolve.outputs.tag }}" <<'PY'
          import json, sys
          ver, xurl, xsha, xsize, aurl, asha, asize, tag = sys.argv[1:]
          p = "feed/manifest.json"
          man = json.load(open(p, encoding="utf-8"))
          man["version"] = ver
          man["notes"] = "自动构建自上游 %s，含飞牛统一网关补丁。产物 x86_64 与 ARM64，glibc≤2.36；已校验 Web UI 嵌入、架构与可执行性。" % tag
          man["assets"] = {"x86_64": {"file": xurl, "sha256": xsha, "size": int(xsize)}, "arm64": {"file": aurl, "sha256": asha, "size": int(asize)}}
          with open(p, "w", encoding="utf-8") as f:
              json.dump(man, f, ensure_ascii=False, indent=2); f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed/manifest.json
          git commit -m "feed: ${{ needs.resolve.outputs.ver }}"
          git push
